name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  # Nothing is versioned or published unless every check passes on this commit.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; pnpm publish hands the tarball to npm.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token: each package trusts this workflow on npmjs.com (Settings → Trusted publisher).
          NPM_CONFIG_PROVENANCE: true
